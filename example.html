<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Target Generator Example</title>
    <!-- Include jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Include the target generator library -->
    <script src="target_generator.js"></script>
    <style>
        body { font-family: sans-serif; margin: 2rem; }
        iframe { width: 100%; height: 600px; border: 1px solid #ccc; margin-top: 1rem; }
        button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Target Generator Library Example</h1>
    <p>This example demonstrates how to programmatically use the library to generate a vector PDF target and display it in the browser.</p>
    
    <button id="generateBtn">Generate 10m Rifle Target</button>
    
    <iframe id="preview"></iframe>

    <script>
        document.getElementById('generateBtn').addEventListener('click', function() {
            // 1. Initialize jsPDF
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            
            // 2. Get center coordinates for the page
            const cx = doc.internal.pageSize.getWidth() / 2;
            const cy = 100; // 100mm from top
            
            // 3. Draw header/title
            doc.setFontSize(16);
            doc.text("ISSF 10m Air Rifle", cx, 20, { align: 'center' });
            
            // 4. Draw the target!
            // drawISSFAt(doc, centerX, centerY, targetSpec, scale)
            drawISSFAt(doc, cx, cy, ISSF['issf_10m_rifle'], 1);
            
            // 5. Output PDF directly to iframe
            const pdfDataUri = doc.output('datauristring');
            document.getElementById('preview').src = pdfDataUri;
        });
    </script>
</body>
</html>
